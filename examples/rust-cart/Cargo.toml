[package]
name = "rust-cart"
version = "0.0.0"
description = "The cart example every host binding of a Souther library is shown with, as a Rust application: cart.sou behind an HTTP boundary decoded by raoh, and its injected behaviors implemented over SQLite"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# The binding bin/build writes from cart.sou: a module per module of the model, and Library. It
# requires souther-binding-runtime from crates.io, which the application reaches only through it.
model = { path = "build/rust" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
# SQLite built from source, so the example needs no SQLite installed beside it.
rusqlite = { version = "0.37", features = ["bundled"] }
# The form of each field at the boundary. The model's own decoders answer in Raoh's issues too.
raoh = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Today, which the quote route hands the model; how long a quotation holds is the model's.
jiff = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
