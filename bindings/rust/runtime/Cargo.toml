[package]
name = "souther-binding-runtime"
version = "0.1.0"
description = "What every Rust binding of a Souther library built by souther-native-compiler runs on: a run's arena, handles, and calls into the library and back"
edition = "2024"
# Raoh's, which every generated crate depends on beside this one: a host is held to the older of
# the two, and this one asks nothing newer.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/souther-lang/souther-native-compiler"
readme = "README.md"
keywords = ["souther", "ffi", "bindings"]

[dependencies]
# Loads a library by path, and looks its functions up through that handle and no other.
libloading = "0.8"
# The issues a reading answers are Raoh's, as every host of a Souther model reads them.
raoh = "0.9"
# An issue's metadata arrives as the JSON object it is, and is Raoh's `Value`s once read.
#
# `arbitrary_precision` keeps a number as it was spelt: a type's decoder hands the library the text
# of the `Value` Raoh read, and the library reads a `Decimal` at the scale it was written at, so
# `1.2300` must reach it as `1.2300`, not as the nearest `f64` written back. Raoh's `Value` is this
# same `serde_json`, so the feature holds for what a host decodes with Raoh too.
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
trybuild = "1"
# The ABI's own tables, which the tests hold every type this crate writes of the ABI to: the
# functions it calls, the rooms it lays out, and the generation it calls a library as. A test's
# only: nothing this crate builds reads them.
souther-native-abi = { path = "../../../native/crates/abi" }

# A function that cannot fail and says it can hands every caller a failure to answer for that never
# comes, and a `?` at the call hides which calls can actually end the work.
[lints.clippy]
unnecessary_wraps = "deny"
