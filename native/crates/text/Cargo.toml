[package]
name = "souther-text"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Nothing of the native backend: this is what the language says text means, over bytes, and
# whatever it reached into here would be one more thing to carry when it moves out to what both
# runtimes read (#17). What Unicode says of text is notation-199x's, which every Souther and Raoh
# runtime reads.
[dependencies]
notation199x.workspace = true

[lints]
workspace = true
