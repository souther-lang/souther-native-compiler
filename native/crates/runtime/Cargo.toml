[package]
name = "souther-native-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
souther-native-abi.workspace = true
souther-json-syntax.workspace = true
# What the language says text means: its length and its order.
souther-text.workspace = true
# What text arriving from outside is canonicalized to (spec §string-canonical).
unicode-normalization = "0.1"
