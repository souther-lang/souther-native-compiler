[package]
name = "souther-native-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
souther-native-abi.workspace = true
souther-json-syntax.workspace = true
# What the language says text means: its length, its order, its canonical form, and what each
# of the `String` module's kernels answers.
souther-text.workspace = true
# Which text is a date, a time, a date-time or an instant, and the fields it writes; what the
# runtime keeps a temporal as is its own.
notation199x.workspace = true
# Exact arithmetic as the language states it: the whole numbers a `Decimal` is worked out with,
# which neighbour a rounding mode answers, and what a `Rational` is and each operation on one
# answers. What a `Decimal` is and where one is kept are `amount`'s and `decimal`'s, and where a
# `Rational` is kept is `rational`'s.
souther-exact.workspace = true

[build-dependencies]
# The generation the runtime says it is, which is the abi crate's number and nothing written here.
souther-native-abi.workspace = true

[lints]
workspace = true
