[workspace]
resolver = "3"
members = [
    "crates/abi",
    "crates/compiler",
    "crates/runtime",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "EPL-2.0"

[workspace.dependencies]
souther-native-abi = { path = "crates/abi" }
cranelift = { version = "0.135.2", features = ["frontend", "module", "native", "object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
