[workspace]
resolver = "3"
members = [
    "crates/abi",
    "crates/compiler",
    "crates/json-syntax",
    "crates/runtime",
    "crates/text",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "EPL-2.0"

# A function that cannot fail and says it can hands every caller a failure to answer for that never
# comes, and a `?` at the call hides which calls can actually end the work.
[workspace.lints.clippy]
unnecessary_wraps = "deny"

[workspace.dependencies]
souther-native-abi = { path = "crates/abi" }
souther-json-syntax = { path = "crates/json-syntax" }
souther-text = { path = "crates/text" }
# The rules for reading text that Raoh and Souther share, implemented once per language: what NFC,
# case, White_Space, a temporal's text and a pattern's image mean here. A commit of develop until a
# release carries the Rust crate, named here and not left to the lock, so that moving it is a change
# of what text means that a commit says, and never a side effect of updating dependencies.
notation199x = { git = "https://github.com/raoh-project/199x-notation", rev = "078c231e0a087b2dd7feb52f066e93ac5a3700c9" }
cranelift = { version = "0.135.2", features = ["frontend", "module", "native", "object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The versions Cranelift already builds: an object is written by the one and its host read off the
# other, and reading one back is the same crate reading what it wrote.
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "macho", "std"] }
target-lexicon = "0.13"
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }

# What the workspace depends on is built optimized even where the workspace is not: Cranelift is
# what the driver spends its time in and num-bigint what the runtime's numbers do, neither is edited
# here, and CI's cache keeps what they build. The workspace's own crates stay a debug build, which
# is what their edits are rebuilt as. The test profile inherits this.
[profile.dev.package."*"]
opt-level = 2
