name: build

# On both of them, because what this project writes is decided by the host: the object's format,
# what the linker wants, and how a symbol is spelt once it is in one. A green build on one of them
# says nothing about the other.
#
# Also what a release runs on the commit it is made from (release.yml calls it): a release is not
# replaced once it is out, and a commit that once passed is not shown to be this one.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        on: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.on }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # PHP with FFI, because what a build hands a host is held to a reader of C declarations
      # that has no preprocessor, and PHP's `FFI::cdef` is the one the tests run. The version is
      # the one a binding for PHP is written for (#32). pdo_sqlite, for the database the cart
      # example runs over. No intl: the library puts text in NFC where it takes it, by the Unicode
      # version the language names rather than the one PHP's ICU was built with.
      # Composer, which the build runs for the runtime's dependencies.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, pdo_sqlite
          ini-values: ffi.enable=1
          tools: composer

      # Go, which a Go binding is built with by cgo, and the Go runtime's tests are run with. The
      # version is the runtime module's own, from its go.mod: the one place it is said, and the one
      # Raoh's need for a Go with generic methods is read from.
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/runtime/go.mod
          cache-dependency-path: |
            bindings/go/runtime/go.sum
            examples/go-cart/go.sum

      # The toolchain comes from rust-toolchain.toml, which rustup reads when cargo is first run
      # in the checkout. Nothing here names a version, so there is one place it is written.
      #
      # rust-cache keys what it restores on the manifests of each workspace's packages and its lock,
      # and nothing else a build reads: not a virtual workspace's root (native/Cargo.toml, with its
      # profiles and dependency features) and not a Cargo config. A key that matches in full is not
      # saved again, so a change to one of those was rebuilt on every run from a cache that never
      # caught up. The key here is those files and no more: it is part of the key a run falls back
      # to as well, so a file rust-cache already hashes put here would turn a change it restores
      # most of into a build from nothing. EveryRustCacheIsKeptUnderWhatDecidesTheBuildTest holds
      # every virtual root in the repository to this list.
      #
      # Saved by develop and main only. A pull request reads what they saved and keeps nothing of its
      # own: each push of one saved some 800MB under a key no other branch reads, the repository's
      # 10GB of caches filled, and GitHub let go of develop's first, so the next pull request found
      # no cache at all and built every crate from nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('native/Cargo.toml', '**/.cargo/config.toml', '**/.cargo/config') }}
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          workspaces: |
            native
            bindings/rust/runtime
            examples/rust-cart

      # souther-compiler comes from Maven Central at the release pom.xml's `souther.version` names.
      # Through verify and not test: the launcher's tests run the generators' jars, which the reactor
      # packs before it, as the command runs any generator's jar. A snapshot of Souther is asked for
      # anew on every run: the Maven cache holds the one an earlier run resolved, which Maven would
      # otherwise keep for a day, and the versions this build takes from Souther's pom with it.
      - run: mvn --batch-mode --update-snapshots verify

      # What follows is a host of each language at a time, all three at once: each waits on a
      # compiler of its own (Composer and PHP, Cargo, Go) and shares nothing with the others but the
      # clone's build, which scripts/souther-native makes one at a time. One after another they took
      # three minutes, most of it with the runner's other cores idle.
      #
      # PHP. What an application does, with no Java calling the API: the command line builds a
      # library and its binding, Composer installs the runtime from its path, and PHP calls the
      # library. Then every Composer project installs what its lock fixes, and the lock still
      # matches it. Then what publishing the runtime does, rehearsed into a mirror that is a
      # directory: a host requires the package from it by name and version, and what a publication
      # would refuse is refused before anything is pushed. Then the cart example, built and tested
      # the way its README says: an
      # application's whole path from HTTP JSON through raoh-php into the model and out to a
      # database over PDO.
      #
      # Rust. The same from Rust: the command line builds a library and its crate, Cargo builds a
      # host depending on the crate with the runtime patched in from the clone, and it calls the
      # library. Then the runtime's library with the rust-version Raoh asks for, which is older than
      # the toolchain this repository pins, so a dependency moving past it is found here and not by
      # a host; its tests run on the pinned toolchain above. Then the same cart over raoh and SQLite,
      # and what rustc refuses a host of the model.
      #
      # Go. The same from Go: the command line builds a library and its module, and a Go host
      # depending on it with the runtime put in place from the clone calls the library. Then what
      # publishing the Go runtime does, rehearsed: the module is resolved by its path and its
      # version, from a tag made as a publication makes it, with no `replace` (which the tests use,
      # and nobody outside this clone has); and what would be refused is refused before anything is
      # pushed. Then the runtime as this commit has it against the version it says it is: where that
      # version is published, it has to be the runtime that was published, so a change to the
      # runtime that leaves its version alone is found here and not by the release that would have
      # failed on it. Then the same cart over raoh-go and SQLite, and what the Go runtime refuses
      # where Rust's types do.
      - run: >-
          scripts/in-parallel.sh
          'scripts/php-from-the-command-line.sh
          && scripts/composer-locks.sh
          && scripts/verify-php-runtime-release.sh
          && scripts/php-cart-example.sh'
          'scripts/rust-from-the-command-line.sh
          && floor="$(sed -nE "s/^rust-version = \"(.*)\"$/\1/p" bindings/rust/runtime/Cargo.toml)"
          && rustup toolchain install "$floor" --profile minimal
          && cargo +"$floor" build --locked --lib --manifest-path bindings/rust/runtime/Cargo.toml
          && scripts/rust-cart-example.sh'
          'scripts/go-from-the-command-line.sh
          && scripts/verify-go-runtime-release.sh
          && scripts/publish-go-runtime.sh --check origin HEAD
          && scripts/go-cart-example.sh'

  # Every souther issue this repository names is a premise that the pinned souther does not yet
  # answer it, and the code around the reference works around the gap. A premise the pin has
  # overtaken is a workaround for an answer the program now gives, and nothing else would say so.
  premises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Maven, because what a premise is held against is the commit the souther-compiler jar the
      # build resolves says it was built from.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: scripts/upstream-premises.sh
        env:
          GH_TOKEN: ${{ github.token }}
