name: build

# On both of them, because what this project writes is decided by the host: the object's format,
# what the linker wants, and how a symbol is spelt once it is in one. A green build on one of them
# says nothing about the other.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        on: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.on }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # A pinned commit and not `develop`: souther's own published SNAPSHOT lags behind what
      # this build needs from time to time — as it does today, for issue #10's CheckedValue split
      # (souther-lang/souther#1880, #1885) — and a runner that fell back to whatever
      # central-snapshots happens to hold would be a build depending on the two repos' publish
      # timing agreeing rather than on a fact this repo states. Bumped by hand when this project
      # starts reading something souther publishes later than this SHA.
      - uses: actions/checkout@v5
        with:
          repository: souther-lang/souther
          ref: c00d74d17cd9678fff69289c446e6ec631535cde
          path: souther

      # Only souther-compiler and what it needs to build, not the whole reactor: the lsp, the
      # cli, the bench harness and the architecture test have nothing this project reads.
      - run: mvn --batch-mode -f souther/pom.xml -pl souther-compiler -am install -DskipTests

      # The toolchain comes from rust-toolchain.toml, which rustup reads when cargo is first run
      # in the checkout. Nothing here names a version, so there is one place it is written.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # --no-snapshot-updates: the pinned install above just wrote souther-compiler's own
      # 0.2.1-SNAPSHOT into this runner's local repository, and without this flag an online
      # dependency resolution here is free to notice a newer timestamped build on
      # central-snapshots and pull that in instead — silently trading the commit this workflow
      # names for whichever one souther last happened to publish. The pinned checkout above only
      # holds if this step is kept from overriding it.
      - run: mvn --batch-mode --no-snapshot-updates test
